<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Auth Container -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-lg max-w-md mx-auto w-full">
<!-- Brand Header Section -->
<header class="text-center mb-xl flex flex-col items-center">
<div class="mb-sm flex items-center justify-center w-32 overflow-hidden rounded-xl">
<img alt="Swapily Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8aWLI9JVKu3Z_DgW1sXqIndHweKrZhvDrzsO0HiyBvQ3-PuFiHvTzTz-FVHUSbe7ecDjyfeD4bGcSAW1RW6fmilTgORz_EkA20T_aWxYaE7A8bBvfjlwIMYDQFwAZ4JFvAaUnPLRtXzM-lz_rJ7rHAR4SzvVWHsN2UMk39I-5Cz4aDeA9qtHNJF8spSrAHzd-xxaGEWcP7Mt0YZUomarHq7qr1solKS_-Fh3K51m0SoCv0miFy0BwM3W0QCuvGXBM7ONzFWE0xKE"/>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight mb-xs">Welcome to Swapily</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                Trade your favorite items with your local community, sustainably and securely.
            </p>
</header>
<!-- Auth Card -->
<section class="w-full bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(27,67,50,0.05)] border border-outline-variant">
<!-- Tab Switcher (Visual only) -->
<div class="flex mb-lg bg-surface-container-low p-1 rounded-lg">
<button class="flex-1 py-2 font-button text-button rounded-md bg-white text-primary shadow-sm">Login</button>
<button class="flex-1 py-2 font-button text-button rounded-md text-on-surface-variant hover:text-primary transition-colors">Sign Up</button>
</div>
<!-- Login Form -->
<form class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-all border border-transparent focus-within:border-primary">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-0 placeholder:text-outline/50" id="email" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-all border border-transparent focus-within:border-primary">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-12 font-body-lg text-body-lg text-on-surface focus:ring-0 placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-full shadow-lg active:scale-95 transition-transform duration-200" type="submit">
                    Login
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-1 border-t border-outline-variant"></div>
<span class="px-3 font-label-md text-label-md text-outline">OR CONTINUE WITH</span>
<div class="flex-1 border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-gutter-mobile">
<button class="flex items-center justify-center gap-xs border border-outline-variant py-3 rounded-lg font-button text-body-sm hover:bg-surface-container-high transition-colors active:scale-95">

<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                    Facebook
                </button>
</div>
</section>

<p class="font-body-sm text-body-sm text-on-surface-variant">

</p>

</div>

<img alt="Swapily Fashion" class="w-full h-full object-cover" data-alt="A stylish, minimalist display of high-quality vintage clothing hanging on a wooden rack in a bright, airy loft space. Soft white light pours in from a large window, creating a clean, modern aesthetic. The scene promotes the idea of circular fashion and elegant item exchanges within a professional yet neighborly digital platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKbismitLgWn5Muwi8SrgM0C8zskgaOgC1gdc4DDlVnmtXWgUZ4noRqcdpoWlQDnNZgcAbZeAkiXV_NgXUh49_WFjxAk-FjpbIvkE_LrJNB5vySygS1Bz_1aPImSDdWXO7dIfsxSuiQxfmRpAh5Bj5dqqOFXEW9BjplvA7ym4LYwU2UOrTGQiYKJ1CTNXX68R7MQRxbjZXVKmNQMvEJiPy8xuILSlIixukCVcs3JU1l_gBpRR8_AzFqz6tw03ZjR4DUOb70HJ8SF4"/>
</div>

<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
